# Configuration de test — surcharge application.properties principal
# Adapter DB_NAME, DB_USER, DB_PASSWORD si vos valeurs locales diffèrent
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:room_booking_test}
spring.datasource.username=${DB_USER:mickakawete}
spring.datasource.password=${DB_PASSWORD:}

spring.flyway.enabled=true

# Secret JWT fixe pour les tests (min. 32 caractères pour HS256)
JWT_SECRET=testSecretKeyForIntegrationTestsLongEnough123
JWT_ACCESS_EXPIRATION=3600000
JWT_REFRESH_EXPIRATION=86400000

cors.allowed-origins=http://localhost:5173

spring.jpa.open-in-view=false

# Réduire le bruit de logs en test
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN
