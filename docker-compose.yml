services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      - database
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # Ajouté : ces 3 variables sont obligatoires pour JwtService (aucune
      # valeur par défaut côté Java). Leur absence empêchait Spring Boot de
      # démarrer, ce qui expliquait le "ENOTFOUND backend" côté frontend.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    ports:
      - "8085:10000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      API_PROXY_TARGET: http://backend:10000
    ports:
      - "5175:5173"